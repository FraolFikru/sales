    $("#pQty").focus();
  }

  function recalc() {
    const d = drafts.purchase;
    const qty = parseNum(d.qty), price = parseNum(d.unitPrice), total = parseNum(d.total);
    if (d.last === "price") {
      d.total = qty > 0 && price >= 0 ? plain(qty * price) : "";
      const el = $("#pTotal"); if (el && document.activeElement !== el) el.value = d.total;
    } else {
      d.unitPrice = qty > 0 && total >= 0 ? plain(total / qty) : d.unitPrice;
      const el = $("#pPrice"); if (el && document.activeElement !== el) el.value = d.unitPrice;
    }
    const sum = $("#pSum"); if (sum) sum.textContent = money(parseNum(d.total) || 0, 2);
    $("#pPrice")?.classList.toggle("computed", d.last === "total");
    $("#pTotal")?.classList.toggle("computed", d.last === "price");
    updatePurchaseHints();
  }

  function updatePurchaseHints() {
    const d = drafts.purchase;
    const hint = $("#itemHint"), ph = $("#priceHint");
    if (!hint || !ph) return;
    const item = d.itemId ? itemById(d.itemId) : null;
    if (item) {
      const last = lastPurchase(item.id);
      hint.className = "hint";
      hint.innerHTML = last
        ? `Last bought ${relDay(last.date).toLowerCase()}${last.vendor ? ` from ${esc(last.vendor)}` : ""} · ${num(last.qty)} ${esc(last.unit)} at ${money(last.unitPrice)}/${esc(last.unit)}`
        : `Saved item · usual price ${money(item.price)}/${esc(item.unit)}`;
      const price = parseNum(d.unitPrice), ref = last?.unitPrice ?? item.price;
      if (price > 0 && ref > 0 && d.unit === (last?.unit ?? item.unit)) {
        const diff = ((price - ref) / ref) * 100;
        if (diff >= 10) { ph.className = "hint warn"; ph.innerHTML = `${icon("alert")} ${Math.round(diff)}% more than last time (${money(ref)}/${esc(d.unit)}). Check the receipt or ask the vendor.`; }
        else if (diff <= -10) { ph.className = "hint good"; ph.textContent = `${Math.round(-diff)}% less than last time (${money(ref)}/${d.unit}).`; }
        else ph.textContent = "";
      } else ph.textContent = "";
    } else if (d.itemQuery.trim()) {
      hint.className = "hint";
      hint.innerHTML = `<span class="tag pending plain">New item</span> “${esc(d.itemQuery.trim())}” will be saved to your item list. Choose its category below.`;
      ph.textContent = "";
    } else { hint.textContent = ""; ph.textContent = ""; }
  }

  function clearErrors(keys) {
    for (const k of keys) {
      if (!ui.errors[k]) continue;
      delete ui.errors[k];
      const p = $(`#err-${k}`); if (p) p.textContent = "";
      const inp = document.querySelector(`[aria-describedby="err-${k}"]`); if (inp) inp.setAttribute("aria-invalid", "false");
    }
  }
  function showErrors(map, order) {
    ui.errors = map;
    for (const k of order) {
      const p = $(`#err-${k}`); if (p) p.textContent = map[k] || "";
      const inp = document.querySelector(`[aria-describedby="err-${k}"]`); if (inp) inp.setAttribute("aria-invalid", map[k] ? "true" : "false");
    }
    const first = order.find((k) => map[k]);
    if (first) document.querySelector(`[aria-describedby="err-${first}"]`)?.focus();
  }

  function savePurchase(another) {
    const d = drafts.purchase;
    const name = d.itemQuery.trim();
    const qty = parseNum(d.qty), total = parseNum(d.total);
    const e = {};
    if (!name) e.item = "Enter what you bought.";
    if (!d.catId) e.cat = "Choose a main category.";
    if (!d.subId) e.sub = "Choose a sub-category.";
    if (!(qty > 0)) e.qty = "Enter a quantity above 0.";
    if (!(total > 0)) e.total = "Enter a unit price or the total.";
    if (d.pay === "later" && !d.due) e.due = "Choose when it is due.";
    const order = ["item", "cat", "sub", "qty", "total", "due"];
    if (Object.keys(e).length) return showErrors(e, order);

    let item = d.itemId ? itemById(d.itemId) : data.items.find((i) => norm(i.name) === norm(name));
    let createdItem = null;
    const unitPrice = round2(total / qty);
    if (!item) {
      item = { id: uid("i"), name, aliases: [], catId: d.catId, subId: d.subId, unit: d.unit, price: unitPrice };
      data.items.push(item);
      createdItem = item;
    }
    const prevPrice = item.price;
    item.price = unitPrice;
    const vendor = d.vendor.trim();
    const newVendor = vendor && !data.vendors.some((v) => norm(v) === norm(vendor));
    if (newVendor) data.vendors.push(vendor);

    const t = {
      id: uid("e"), seq: ++seqN, kind: "expense", date: d.date || TODAY, itemId: item.id, name: item.name, catId: d.catId, subId: d.subId,
      qty, unit: d.unit, unitPrice, total: round2(total), vendor,
      status: d.pay === "paid" ? "paid" : "pending", method: d.pay === "paid" ? d.method : null,
      paidDate: d.pay === "paid" ? d.date || TODAY : null, due: d.pay === "later" ? d.due : null, note: d.note.trim(),
    };
    data.tx.push(t);
    drafts.purchase = another ? newPurchaseDraft({ vendor: d.vendor, date: d.date, pay: d.pay, method: d.method, due: d.due }) : newPurchaseDraft();
    ui.errors = {};
    renderView("#pItem");
    toast(`Saved ${item.name} · ${num(qty)} ${d.unit} · ${money(t.total, 2)}${createdItem ? " · new item added" : ""}`, () => {
      data.tx = data.tx.filter((x) => x.id !== t.id);
      item.price = prevPrice;
      if (createdItem) data.items = data.items.filter((x) => x.id !== createdItem.id);
      if (newVendor) data.vendors = data.vendors.filter((v) => v !== vendor);
      renderView();
    });
  }

  /* =========================================================
     Sales
     ========================================================= */
  const SALE_CHIPS = ["Lunch service", "Dinner service", "Coffee & drinks", "Takeaway", "Catering"];

  function viewSales() {
    const d = drafts.sale;
    return `
      <div class="page-head"><div><h1>Sales</h1><p>Record money coming in and how it was paid.</p></div></div>
      <div class="split">
        <form class="card form" id="saleForm" novalidate aria-labelledby="sfTitle">
          <h2 id="sfTitle" class="sr">New sale</h2>
          <div class="form-sec">
            <span class="sec-title">What was sold?</span>
            <div class="quick-chips" role="group" aria-label="Common sales">${SALE_CHIPS.map((c) => `<button type="button" data-action="s-chip" data-value="${esc(c)}" aria-pressed="${d.label === c}">${esc(c)}</button>`).join("")}</div>
            <div class="field"><label for="sLabel">Description</label>
              <input id="sLabel" class="input" type="text" placeholder="e.g. Lunch service, table 4" value="${esc(d.label)}" data-bind="sale.label" ${inv("label")}>${errP("label")}</div>
            <div class="row">
              <div class="field big-amt"><label for="sAmount">Amount</label>
                <div class="affix"><span>ETB</span><input id="sAmount" class="input num-in" inputmode="decimal" autocomplete="off" placeholder="0.00" value="${esc(d.amount)}" data-bind="sale.amount" ${inv("amount")}></div>${errP("amount")}</div>
              <div class="field"><label for="sDate">Date</label><input id="sDate" class="input" type="date" max="${TODAY}" value="${esc(d.date)}" data-bind="sale.date"></div>
            </div>
          </div>
          <div class="form-sec">
            <span class="sec-title">Payment</span>
            <div class="field"><span class="label" id="sStLbl">Status</span>
              <div class="seg lg" role="group" aria-labelledby="sStLbl">
                <button type="button" data-action="s-status" data-value="paid" aria-pressed="${d.status === "paid"}">Paid</button>
                <button type="button" data-action="s-status" data-value="pending" aria-pressed="${d.status === "pending"}">On credit</button>
              </div></div>
            <div id="saleBlock">${saleBlock()}</div>
          </div>
          <div class="total-bar">
            <div><span class="label">Sale total</span><output id="sSum" aria-live="polite">${money(parseNum(d.amount) || 0, 2)}</output></div>
            <div class="form-actions"><button type="submit" class="btn primary">${icon("check")} Save sale</button></div>
          </div>
        </form>
        <aside class="side" aria-label="Today's sales">${saleSide()}</aside>
      </div>`;
  }

  function saleBlock() {
    const d = drafts.sale;
    if (d.status === "paid") {
      return `<div class="field"><span class="label" id="smLbl">Payment method</span>
        <div class="seg lg" role="group" aria-labelledby="smLbl">${METHOD_KEYS.map((k) => `<button type="button" data-action="s-method" data-value="${k}" aria-pressed="${d.method === k}">${icon(METHODS[k].icon)}<span>${METHODS[k].label}<small>${METHODS[k].hint}</small></span></button>`).join("")}</div></div>
        ${d.method !== "cash" ? `<div class="field" style="margin-top:12px"><label for="sRef">Transaction reference <span class="opt-label">(optional)</span></label>
          <input id="sRef" class="input" type="text" placeholder="${d.method === "mobile" ? "e.g. Telebirr transaction ID" : "e.g. last 4 digits"}" value="${esc(d.ref)}" data-bind="sale.ref"></div>` : ""}`;
    }
    return `<div class="row">
      <div class="field"><label for="sCustomer">Customer</label><input id="sCustomer" class="input" type="text" placeholder="e.g. Zemen Office Lunch" value="${esc(d.customer)}" data-bind="sale.customer" ${inv("customer")}>${errP("customer")}</div>
      <div class="field"><label for="sDue">Expected by</label><input id="sDue" class="input" type="date" min="${TODAY}" value="${esc(d.due)}" data-bind="sale.due"></div>
    </div>`;
  }

  function saleSide() {
    const today = data.tx.filter((t) => t.kind === "sale" && t.date === TODAY).sort((a, b) => b.seq - a.seq);
    const total = today.reduce((s, t) => s + t.total, 0);
    const byM = { cash: 0, card: 0, mobile: 0, credit: 0 };
    for (const t of today) byM[t.status === "paid" ? t.method : "credit"] += t.total;
    const lastWeek = sums(addDays(TODAY, -7), addDays(TODAY, -7)).revenue;
    const rows = [...METHOD_KEYS.map((k) => [METHODS[k].label, byM[k]]), ...(byM.credit ? [["On credit", byM.credit]] : [])];
    return `
      <section class="card">
        <div class="card-head"><div><h2>Sales today</h2><p>Same day last week: ${money(lastWeek)} ${chip(change(total, lastWeek), true)}</p></div></div>
        <div class="sum-total"><span class="meta">Total</span><strong>${money(total, 2)}</strong></div>
        <div class="bar-list">${rows.map(([l, v]) => `
          <div class="bar-row"><span>${l}</span><span class="num">${money(v)}</span><div class="bar-track sale"><i style="width:${total ? (v / total) * 100 : 0}%"></i></div></div>`).join("")}</div>
      </section>
      <section class="card">
        <div class="card-head"><h2>Today's sales</h2></div>
        ${today.length ? `<ul class="entry-list">${today.slice(0, 12).map((t) => `
          <li class="entry"><strong>${esc(t.label)}</strong><span class="num">${money(t.total)}</span>
            <div class="entry-meta"><span>${t.status === "paid" ? METHODS[t.method].label : `On credit · ${esc(t.customer)}`}</span>
              <span style="display:flex;gap:6px;align-items:center"><span class="tag ${statusOf(t)}">${STATUS_TEXT[statusOf(t)]}</span>
              <button class="btn ghost small icon-btn" data-action="remove-tx" data-id="${t.id}" aria-label="Remove ${esc(t.label)}">${icon("trash")}</button></span></div></li>`).join("")}</ul>`
          : `<div class="empty"><strong>No sales recorded today</strong>Save a sale and it will appear here.</div>`}
      </section>`;
  }

  function mountSale() {
    const amt = $("#sAmount");
    if (amt) amt.addEventListener("input", () => { $("#sSum").textContent = money(parseNum(drafts.sale.amount) || 0, 2); });
  }

  function saveSale() {
    const d = drafts.sale;
    const amount = parseNum(d.amount);
    const e = {};
    if (!d.label.trim()) e.label = "Describe the sale, or tap one of the options above.";
    if (!(amount > 0)) e.amount = "Enter an amount above 0.";
    if (d.status === "pending" && !d.customer.trim()) e.customer = "Who owes this money?";
    const order = ["label", "amount", "customer"];
    if (Object.keys(e).length) return showErrors(e, order);
    const t = {
      id: uid("s"), seq: ++seqN, kind: "sale", date: d.date || TODAY, label: d.label.trim(), total: round2(amount),
      method: d.status === "paid" ? d.method : null, status: d.status, paidDate: d.status === "paid" ? d.date || TODAY : null,
      customer: d.customer.trim(), due: d.status === "pending" ? d.due : null, ref: d.ref.trim(),
    };
    data.tx.push(t);
    drafts.sale = newSaleDraft({ method: d.method, date: d.date });
    ui.errors = {};
    renderView("#sLabel");
    toast(`Saved ${t.label} · ${money(t.total, 2)} · ${t.method ? METHODS[t.method].label : "on credit"}`, () => {
      data.tx = data.tx.filter((x) => x.id !== t.id);
      renderView();
    });
  }

  /* =========================================================
     Payables & reconciliation
     ========================================================= */
  function dueText(t) {
    if (!t.due) return { cls: "pending", text: "Pending" };
    const n = daysBetween(TODAY, t.due);
    if (n < 0) return { cls: "overdue", text: `Overdue ${-n} day${n === -1 ? "" : "s"}` };
    if (n === 0) return { cls: "pending", text: "Due today" };
    return { cls: "pending", text: `Due in ${n} day${n === 1 ? "" : "s"}` };
  }

  function payRow(t) {
    const dt = dueText(t);
    const isSale = t.kind === "sale";
    const open = ui.paying === t.id;
    const bill = !isSale && catById(t.catId)?.bill;
    return `<li class="pay-row" id="row-${t.id}">
      <div class="due"><span class="tag ${dt.cls}">${dt.text}</span><div class="meta" style="margin-top:3px">${t.due ? fmtDay(t.due) : ""}</div></div>
      <div class="who"><strong>${esc(isSale ? t.customer || t.label : t.name)}</strong>
        <span class="meta">${isSale ? `${esc(t.label)} · ${fmtDay(t.date)}` : `${esc(t.vendor || "No vendor")} · ${bill ? "Bill" : esc(crumb(t.catId, t.subId))}`}</span></div>
      <span class="num">${money(t.total, 2)}</span>
      <div class="act">${open ? "" : `<button class="btn small" data-action="pay-start" data-id="${t.id}" aria-expanded="false" aria-controls="confirm-${t.id}">${isSale ? "Mark received" : "Mark paid"}</button>`}</div>
      ${open ? `<div class="pay-confirm" id="confirm-${t.id}" role="group" aria-label="${isSale ? "Confirm payment received" : "Confirm payment"}">
        <span class="label">${isSale ? "Received by" : "Paid with"}</span>
        <div class="seg" role="group" aria-label="Payment method">${METHOD_KEYS.map((k) => `<button type="button" data-action="pay-method" data-value="${k}" aria-pressed="${ui.payMethod === k}">${METHODS[k].label}</button>`).join("")}</div>
        <span class="spacer"></span>
        <button class="btn small ghost" data-action="pay-cancel">Cancel</button>
        <button class="btn small primary" data-action="pay-confirm" data-id="${t.id}">${icon("check")} Confirm ${money(t.total)}</button>
      </div>` : ""}
    </li>`;
  }

  function viewPayables() {
    const pendingExp = data.tx.filter((t) => t.kind === "expense" && t.status !== "paid").sort((a, b) => (a.due || "9") < (b.due || "9") ? -1 : 1);
    const pendingSales = data.tx.filter((t) => t.kind === "sale" && t.status !== "paid").sort((a, b) => (a.due || "9") < (b.due || "9") ? -1 : 1);
    const vendorsOwed = pendingExp.filter((t) => !catById(t.catId)?.bill).reduce((s, t) => s + t.total, 0);
    const bills = pendingExp.filter((t) => catById(t.catId)?.bill).reduce((s, t) => s + t.total, 0);
    const overdue = pendingExp.filter(isOverdue);
    const owedToYou = pendingSales.reduce((s, t) => s + t.total, 0);

    // reconciliation: money actually moved in the last 30 days, by method
    const start = addDays(TODAY, -29);
    const rec = Object.fromEntries(METHOD_KEYS.map((k) => [k, { in: 0, out: 0 }]));
    for (const t of data.tx) {
      if (t.status !== "paid" || !t.paidDate || t.paidDate < start || t.paidDate > TODAY || !t.method) continue;
      rec[t.method][t.kind === "sale" ? "in" : "out"] += t.total;
    }
    const tot = METHOD_KEYS.reduce((a, k) => ({ in: a.in + rec[k].in, out: a.out + rec[k].out }), { in: 0, out: 0 });
    const netCell = (v) => `<td class="num ${v >= 0 ? "pos" : "neg"}">${v >= 0 ? "+" : "−"}${money(v, 0)}</td>`;
    const payouts = data.tx.filter((t) => t.kind === "expense" && t.status === "paid" && t.paidDate).sort((a, b) => (a.paidDate < b.paidDate ? 1 : a.paidDate > b.paidDate ? -1 : b.seq - a.seq)).slice(0, 8);

    return `
      <div class="page-head"><div><h1>Payables</h1><p>What you owe, what you're owed, and where the money went.</p></div></div>
      <section class="mini-kpis" aria-label="Summary">
        <div class="card"><span class="label">Owed to vendors</span><strong>${money(vendorsOwed)}</strong><span class="meta">${pendingExp.filter((t) => !catById(t.catId)?.bill).length} open purchases</span></div>
        <div class="card"><span class="label">Bills due</span><strong>${money(bills)}</strong><span class="meta">Utilities &amp; salaries</span></div>
        <div class="card ${overdue.length ? "alert" : ""}"><span class="label">Overdue</span><strong>${money(overdue.reduce((s, t) => s + t.total, 0))}</strong><span class="meta">${overdue.length ? `${overdue.length} past due date · pay these first` : "Nothing overdue"}</span></div>
        <div class="card"><span class="label">Customers owe you</span><strong>${money(owedToYou)}</strong><span class="meta">${pendingSales.length} credit sale${pendingSales.length === 1 ? "" : "s"}</span></div>
      </section>

      <section class="card" aria-labelledby="toPayTitle">
        <div class="card-head"><div><h2 id="toPayTitle">To pay</h2><p>Sorted by due date, overdue first</p></div></div>
        ${pendingExp.length ? `<ul class="pay-list">${pendingExp.map(payRow).join("")}</ul>` : `<div class="empty"><strong>All paid up</strong>New purchases on credit will appear here.</div>`}
      </section>

      <div class="two-col">
        <section class="card" aria-labelledby="owedTitle">
          <div class="card-head"><div><h2 id="owedTitle">Customers owe you</h2><p>Credit sales waiting for payment</p></div></div>
          ${pendingSales.length ? `<ul class="pay-list">${pendingSales.map(payRow).join("")}</ul>` : `<div class="empty"><strong>Nothing outstanding</strong>Sales marked “On credit” will appear here.</div>`}
        </section>
        <section class="card" aria-labelledby="recTitle">
          <div class="card-head"><div><h2 id="recTitle">Reconciliation</h2><p>Money that actually moved, last 30 days</p></div></div>
          <div class="table-scroll"><table class="recon">
            <thead><tr><th>Method</th><th class="num">Money in</th><th class="num">Money out</th><th class="num">Net</th></tr></thead>
            <tbody>${METHOD_KEYS.map((k) => `<tr><td>${METHODS[k].label}<div class="meta">${METHODS[k].hint}</div></td><td class="num">${money(rec[k].in, 0)}</td><td class="num">${money(rec[k].out, 0)}</td>${netCell(rec[k].in - rec[k].out)}</tr>`).join("")}</tbody>
            <tfoot><tr><td>Total</td><td class="num">${money(tot.in, 0)}</td><td class="num">${money(tot.out, 0)}</td>${netCell(tot.in - tot.out)}</tr></tfoot>
          </table></div>
          <p class="meta" style="margin:12px 0 0">Compare each line with your cash count, POS report and Telebirr / CBE statements. A gap means a payment was not logged. Payroll goes out by bank transfer, so it shows under Mobile banking.</p>
        </section>
      </div>

      <section class="card" aria-labelledby="payoutTitle">
        <div class="card-head"><div><h2 id="payoutTitle">Recent payouts</h2><p>Completed payments to vendors and bills</p></div></div>
        <ul class="entry-list">${payouts.map((t) => `
          <li class="entry"><strong>${esc(t.name)}</strong><span class="num">${money(t.total)}</span>
            <div class="entry-meta"><span>${esc(t.vendor || "No vendor")} · ${METHODS[t.method]?.label || ""}</span><span>${relDay(t.paidDate)}</span></div></li>`).join("")}</ul>
      </section>`;
  }

  function confirmPay(id) {
    const t = data.tx.find((x) => x.id === id);
    if (!t) return;
    const prev = { status: t.status, method: t.method, paidDate: t.paidDate };
    Object.assign(t, { status: "paid", method: ui.payMethod, paidDate: TODAY });
    ui.paying = null;
    renderView();
    const who = t.kind === "sale" ? t.customer || t.label : t.vendor || t.name;
    toast(`${t.kind === "sale" ? "Received" : "Paid"} ${money(t.total)} · ${who} · ${METHODS[t.method].label}`, () => { Object.assign(t, prev); renderView(); });
  }

  /* =========================================================
     Items & categories drawer
     ========================================================= */
  function openDrawer(tab, opts = {}) {
    ui.drawer = { tab, prefill: opts.prefill || "", fromPurchase: !!opts.fromPurchase, returnFocus: opts.returnFocus || null, catId: "", subId: "" };
    if (opts.prefill && ui.view === "purchases") {
      ui.drawer.catId = drafts.purchase.catId;
      ui.drawer.subId = drafts.purchase.subId;
    }
    renderDrawer();
    const first = tab === "items" ? "#niName" : tab === "categories" ? "#ncName" : "#nuName";
    $(first)?.focus();
  }
  function closeDrawer() {
    const back = ui.drawer?.returnFocus;
    ui.drawer = null;
    $("#drawerRoot").innerHTML = "";
    document.body.style.overflow = "";
    if (back) $(back)?.focus();
  }

  function renderDrawer() {
    const dr = ui.drawer;
    if (!dr) return;
    document.body.style.overflow = "hidden";
    const tab = (k, l) => `<button type="button" role="tab" id="tab-${k}" aria-selected="${dr.tab === k}" aria-controls="panel-${k}" data-action="drawer-tab" data-value="${k}" aria-pressed="${dr.tab === k}">${l}</button>`;
    let body = "";
    if (dr.tab === "items") {
      const q = norm(ui.manageQuery);
      const list = data.items.filter((i) => !q || norm(i.name).includes(q) || i.aliases.some((a) => norm(a).includes(q)));
      body = `
        <form id="itemForm" novalidate>
          <h3>Add an item</h3>
          <div class="field"><label for="niName">Item name</label><input id="niName" class="input" required value="${esc(dr.prefill)}" placeholder="e.g. Red Onion" aria-describedby="err-niName"><p class="err" id="err-niName"></p></div>
          <div class="field"><label for="niAlias">Other names <span class="opt-label">(optional, comma separated)</span></label><input id="niAlias" class="input" placeholder="e.g. Key shinkurt, ቀይ ሽንኩርት"><p class="hint">Search will match these too, so staff can type the Amharic name.</p></div>
          <div class="row">
            <div class="field"><label for="niCat">Main category</label><select id="niCat" class="input" data-role="ni-cat" aria-describedby="err-niCat">${catOptions(dr.catId)}</select><p class="err" id="err-niCat"></p></div>
            <div class="field"><label for="niSub">Sub-category</label><select id="niSub" class="input" aria-describedby="err-niSub">${subOptions(dr.catId, dr.subId)}</select><p class="err" id="err-niSub"></p></div>
          </div>
          <div class="row">
            <div class="field"><label for="niUnit">Default unit</label><select id="niUnit" class="input">${unitOptions(ui.view === "purchases" ? drafts.purchase.unit : "kg")}</select></div>
            <div class="field"><label for="niPrice">Usual price <span class="opt-label">(ETB)</span></label><input id="niPrice" class="input num-in" inputmode="decimal" placeholder="0.00"></div>
          </div>
          <button class="btn primary" type="submit">${icon("plus")} ${dr.fromPurchase ? "Add item and use it" : "Add item"}</button>
        </form>
        <div>
          <label class="search" style="margin-bottom:8px">${icon("search")}<span class="sr">Search items</span><input id="manageSearch" type="search" placeholder="Search ${data.items.length} items" value="${esc(ui.manageQuery)}" data-bind="manageQuery"></label>
          <ul class="item-list" id="manageList">${list.map((i) => `<li><span><strong>${esc(i.name)}</strong><small>${esc(crumb(i.catId, i.subId))}${i.aliases.length ? ` · ${esc(i.aliases.join(", "))}` : ""}</small></span><span class="num meta">${money(i.price)}/${esc(i.unit)}</span></li>`).join("") || `<li class="meta">No items match.</li>`}</ul>
        </div>`;
    } else if (dr.tab === "categories") {
      body = `
        <form id="catForm" novalidate>
          <h3>Add a main category</h3>
          <div class="field"><label for="ncName">Name</label><input id="ncName" class="input" placeholder="e.g. Rent, Transport, Marketing" aria-describedby="err-ncName"><p class="err" id="err-ncName"></p></div>
          <div class="checks">
            <label class="check"><input type="checkbox" id="ncStock"><span>Counts as inventory<small>Included in “Inventory purchases” on the overview.</small></span></label>
            <label class="check"><input type="checkbox" id="ncBill"><span>Recurring bill<small>Shown under “Bills due” in Payables.</small></span></label>
          </div>
          <button class="btn primary" type="submit">${icon("plus")} Add category</button>
        </form>
        <form id="subForm" novalidate>
          <h3>Add a sub-category</h3>
          <div class="row">
            <div class="field"><label for="nsCat">Under</label><select id="nsCat" class="input">${data.categories.map((c) => `<option value="${c.id}" ${c.id === (ui.view === "purchases" ? drafts.purchase.catId : "") ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select></div>
            <div class="field"><label for="nsName">Name</label><input id="nsName" class="input" placeholder="e.g. Fish" aria-describedby="err-nsName"><p class="err" id="err-nsName"></p></div>
          </div>
          <button class="btn primary" type="submit">${icon("plus")} Add sub-category</button>
        </form>
        <ul class="tree" aria-label="Category hierarchy">${data.categories.map((c) => `
          <li><strong>${esc(c.name)} ${c.stock ? '<span class="tag plain">Inventory</span>' : ""}${c.bill ? '<span class="tag plain">Bill</span>' : ""}</strong>
            <ul>${c.subs.map((s) => `<li class="tag plain">${esc(s.name)}</li>`).join("") || '<li class="meta">No sub-categories yet</li>'}</ul></li>`).join("")}</ul>`;
    } else {
      const usage = new Map();
      for (const t of data.tx) if (t.kind === "expense") usage.set(t.unit, (usage.get(t.unit) || 0) + 1);
      body = `
        <form id="unitForm" novalidate>
          <h3>Add a unit of measure</h3>
          <div class="field"><label for="nuName">Unit</label><input id="nuName" class="input" placeholder="e.g. sacks, crates, trays" aria-describedby="err-nuName"><p class="err" id="err-nuName"></p></div>
          <button class="btn primary" type="submit">${icon("plus")} Add unit</button>
        </form>
        <div class="unit-chips" aria-label="Units">${data.units.map((u) => `<span class="tag plain">${esc(u)} <span class="meta">· ${usage.get(u) || 0}</span></span>`).join("")}</div>`;
    }
    $("#drawerRoot").innerHTML = `
      <div class="scrim" data-action="close-manage"></div>
      <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" id="drawer">
        <div class="drawer-head"><h2 id="drawerTitle">Items &amp; categories</h2><button class="btn icon-btn ghost" data-action="close-manage" aria-label="Close">${icon("x")}</button></div>
        <div class="drawer-tabs"><div class="seg" role="tablist" aria-label="Manage">${tab("items", "Items")}${tab("categories", "Categories")}${tab("units", "Units")}</div></div>
        <div class="drawer-body" role="tabpanel" id="panel-${dr.tab}" aria-labelledby="tab-${dr.tab}">${body}</div>
      </aside>`;
  }

  function fieldErr(id, msg) {
    const p = $(`#err-${id}`); if (p) p.textContent = msg;
    const el = $(`#${id}`); if (el) { el.setAttribute("aria-invalid", msg ? "true" : "false"); if (msg) el.focus(); }
    return !!msg;
  }

  function submitItemForm() {
    const name = $("#niName").value.trim(), catId = $("#niCat").value, subId = $("#niSub").value;
    ["niName", "niCat", "niSub"].forEach((id) => fieldErr(id, ""));
    if (!name) return fieldErr("niName", "Enter the item name.");
    if (data.items.some((i) => norm(i.name) === norm(name))) return fieldErr("niName", "This item is already saved. Search for it instead.");
    if (!catId) return fieldErr("niCat", "Choose a main category.");
    if (!subId) return fieldErr("niSub", "Choose a sub-category.");
    const price = parseNum($("#niPrice").value);
    const item = {
      id: uid("i"), name, aliases: $("#niAlias").value.split(",").map((s) => s.trim()).filter(Boolean),
      catId, subId, unit: $("#niUnit").value, price: price > 0 ? round2(price) : 0,
    };
    data.items.push(item);
    if (ui.drawer.fromPurchase && ui.view === "purchases") {
      closeDrawer();
      renderView();
      pickItem(item);
      if (!(item.price > 0)) { drafts.purchase.unitPrice = ""; $("#pPrice").value = ""; }
      toast(`Added ${item.name} to ${crumb(catId, subId)}`);
      return;
    }
    ui.drawer.prefill = "";
    renderDrawer();
    $("#niName").focus();
    if (ui.view === "purchases") refreshPurchaseSelects();
    toast(`Added ${item.name} to ${crumb(catId, subId)}`, () => { data.items = data.items.filter((i) => i !== item); if (ui.drawer) renderDrawer(); });
  }
  function submitCatForm() {
    const name = $("#ncName").value.trim();
    fieldErr("ncName", "");
    if (!name) return fieldErr("ncName", "Enter a category name.");
    if (data.categories.some((c) => norm(c.name) === norm(name))) return fieldErr("ncName", "That category already exists.");
    const c = { id: uid("c"), name, stock: $("#ncStock").checked, bill: $("#ncBill").checked, subs: [] };
    data.categories.push(c);
    renderDrawer(); $("#nsCat").value = c.id; $("#nsName").focus();
    refreshPurchaseSelects();
    toast(`Added category ${name}. Add a sub-category under it next.`);
  }
  function submitSubForm() {
    const catId = $("#nsCat").value, name = $("#nsName").value.trim();
    fieldErr("nsName", "");
    const c = catById(catId);
    if (!name) return fieldErr("nsName", "Enter a sub-category name.");
    if (c.subs.some((s) => norm(s.name) === norm(name))) return fieldErr("nsName", `${c.name} already has ${name}.`);
    const s = { id: uid("s"), name };
    c.subs.push(s);
    if (ui.view === "purchases" && (!drafts.purchase.catId || drafts.purchase.catId === catId)) { drafts.purchase.catId = catId; drafts.purchase.subId = s.id; }
    renderDrawer(); $("#nsCat").value = catId; $("#nsName").focus();
    refreshPurchaseSelects();
    toast(`Added ${c.name} › ${name}`);
  }
  function submitUnitForm() {
    const name = $("#nuName").value.trim().toLowerCase();
    fieldErr("nuName", "");
    if (!name) return fieldErr("nuName", "Enter a unit, e.g. sacks.");
    if (data.units.includes(name)) return fieldErr("nuName", "That unit already exists.");
    data.units.push(name);
    if (ui.view === "purchases") drafts.purchase.unit = name;
    renderDrawer(); $("#nuName").focus();
    refreshPurchaseSelects();
    toast(`Added unit “${name}”`);
  }
  function refreshPurchaseSelects() {
    if (ui.view !== "purchases") return;
    const d = drafts.purchase;
    if ($("#pCat")) $("#pCat").innerHTML = catOptions(d.catId);
    if ($("#pSub")) $("#pSub").innerHTML = subOptions(d.catId, d.subId);
    if ($("#pUnit")) $("#pUnit").innerHTML = unitOptions(d.unit);
  }

  /* =========================================================
     Toast
     ========================================================= */
  let toastTimer = 0, undoFn = null;
  function toast(msg, undo) {
    clearTimeout(toastTimer);
    undoFn = undo || null;
    $("#toastWrap").innerHTML = `<div class="toast">${icon("check")}<p>${esc(msg)}</p>${undo ? `<button data-action="undo">Undo</button>` : ""}</div>`;
    toastTimer = setTimeout(() => { $("#toastWrap").innerHTML = ""; undoFn = null; }, 6500);
  }

  /* =========================================================
     Events
     ========================================================= */
  const actions = {
    period: (el) => { ui.period = el.dataset.value; renderView(); },
    chart: (el) => { ui.chart = el.dataset.value; renderView(); $(`[data-action="chart"][data-value="${ui.chart}"]`)?.focus(); },
    "f-kind": (el) => { ui.filter.kind = el.dataset.value; ui.limit = 12; updateFilterButtons(); renderTable(); },
    "f-status": (el) => { ui.filter.status = el.dataset.value; ui.limit = 12; updateFilterButtons(); renderTable(); },
    "clear-filters": () => { ui.filter = { kind: "all", status: "all", q: "" }; ui.limit = 12; $("#txSearch").value = ""; updateFilterButtons(); renderTable(); },
    more: () => { ui.limit += 12; renderTable(); },
    "go-pay": (el) => { ui.paying = el.dataset.id; ui.payMethod = "cash"; go("payables"); requestAnimationFrame(() => { const row = $(`#row-${el.dataset.id}`); row?.scrollIntoView({ block: "center" }); row?.querySelector('[data-action="pay-confirm"]')?.focus(); }); },
    "pay-start": (el) => { ui.paying = el.dataset.id; ui.payMethod = "cash"; renderView(`#row-${el.dataset.id} [data-action="pay-confirm"]`); },
    "pay-method": (el) => { ui.payMethod = el.dataset.value; el.parentElement.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b === el))); },
    "pay-cancel": () => { const id = ui.paying; ui.paying = null; renderView(`#row-${id} [data-action="pay-start"]`); },
    "pay-confirm": (el) => confirmPay(el.dataset.id),
    "p-pay": (el) => { drafts.purchase.pay = el.dataset.value; setPressed(el); $("#payBlock").innerHTML = payBlock(); },
    "p-method": (el) => { drafts.purchase.method = el.dataset.value; setPressed(el); },
    "save-purchase": (el) => savePurchase(!!el.dataset.another),
    "s-chip": (el) => { drafts.sale.label = el.dataset.value; $("#sLabel").value = el.dataset.value; setPressed(el); clearErrors(["label"]); $("#sAmount").focus(); },
    "s-method": (el) => { drafts.sale.method = el.dataset.value; $("#saleBlock").innerHTML = saleBlock(); $(`[data-action="s-method"][data-value="${el.dataset.value}"]`)?.focus(); },
    "s-status": (el) => { drafts.sale.status = el.dataset.value; setPressed(el); $("#saleBlock").innerHTML = saleBlock(); },
    "remove-tx": (el) => {
      const i = data.tx.findIndex((t) => t.id === el.dataset.id);
      if (i < 0) return;
      const [t] = data.tx.splice(i, 1);
      renderView();
      toast(`Removed ${t.kind === "sale" ? t.label : t.name} · ${money(t.total)}`, () => { data.tx.push(t); renderView(); });
    },
    "open-manage": (el) => openDrawer(el.dataset.tab || "items", {
      prefill: el.dataset.prefill && !drafts.purchase.itemId ? drafts.purchase.itemQuery.trim() : "",
      fromPurchase: !!el.dataset.prefill, returnFocus: el.id ? `#${el.id}` : ui.view === "purchases" ? "#pItem" : null,
    }),
    "close-manage": () => closeDrawer(),
    "drawer-tab": (el) => { ui.drawer.tab = el.dataset.value; renderDrawer(); $(`#tab-${el.dataset.value}`)?.focus(); },
    theme: () => toggleTheme(),
    undo: () => { const f = undoFn; undoFn = null; $("#toastWrap").innerHTML = ""; if (f) f(); },
    "quick-purchase": () => go("purchases", "#pItem"),
    "quick-sale": () => go("sales", "#sLabel"),
  };
  const setPressed = (el) => el.parentElement.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b === el)));
  function updateFilterButtons() {
    document.querySelectorAll('[data-action="f-kind"]').forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.value === ui.filter.kind)));
    document.querySelectorAll('[data-action="f-status"]').forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.value === ui.filter.status)));
  }

  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const fn = actions[el.dataset.action];
    if (fn) { e.preventDefault(); fn(el, e); }
  });

  document.addEventListener("submit", (e) => {
    e.preventDefault();
    const id = e.target.id;
    if (id === "purchaseForm") savePurchase(false);
    else if (id === "saleForm") saveSale();
    else if (id === "itemForm") submitItemForm();
    else if (id === "catForm") submitCatForm();
    else if (id === "subForm") submitSubForm();
    else if (id === "unitForm") submitUnitForm();
  });

  document.addEventListener("input", (e) => {
    const el = e.target;
    const bind = el.dataset?.bind;
    if (!bind) return;
    const [scope, key] = bind.split(".");
    if (scope === "filter") { ui.filter.q = el.value; ui.limit = 12; renderTable(); return; }
    if (scope === "manageQuery") {
      ui.manageQuery = el.value;
      const q = norm(el.value);
      const list = data.items.filter((i) => !q || norm(i.name).includes(q) || i.aliases.some((a) => norm(a).includes(q)));
      $("#manageList").innerHTML = list.map((i) => `<li><span><strong>${esc(i.name)}</strong><small>${esc(crumb(i.catId, i.subId))}</small></span><span class="num meta">${money(i.price)}/${esc(i.unit)}</span></li>`).join("") || `<li class="meta">No items match.</li>`;
      return;
    }
    const d = drafts[scope];
    if (!d) return;
    d[key] = el.value;
    if (scope === "purchase") {
      if (key === "itemQuery") {
        const it = d.itemId ? itemById(d.itemId) : null;
        if (it && norm(it.name) !== norm(el.value)) d.itemId = null;
        clearErrors(["item"]);
        updatePurchaseHints();
      }
      if (key === "qty") { clearErrors(["qty"]); recalc(); }
      if (key === "unitPrice") { d.last = "price"; clearErrors(["total"]); recalc(); }
      if (key === "total") { d.last = "total"; clearErrors(["total"]); recalc(); }
      if (key === "due") clearErrors(["due"]);
    }
    if (scope === "sale") {
      if (key === "label") { clearErrors(["label"]); document.querySelectorAll('[data-action="s-chip"]').forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.value === el.value))); }
      if (key === "amount") clearErrors(["amount"]);
      if (key === "customer") clearErrors(["customer"]);
    }
  });

  document.addEventListener("change", (e) => {
    const el = e.target;
    if (el.dataset?.role === "ni-cat") { $("#niSub").innerHTML = subOptions(el.value, ""); return; }
    const bind = el.dataset?.bind;
    if (!bind) return;
    const [scope, key] = bind.split(".");
    const d = drafts[scope];
    if (!d) return;
    d[key] = el.value;
    if (scope === "purchase" && key === "catId") { d.subId = ""; $("#pSub").innerHTML = subOptions(d.catId, ""); clearErrors(["cat"]); }
    if (scope === "purchase" && key === "subId") clearErrors(["sub"]);
    if (scope === "purchase" && key === "unit") updatePurchaseHints();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && ui.drawer) { e.preventDefault(); closeDrawer(); return; }
    if (e.key === "Tab" && ui.drawer) { // keep focus inside the drawer
      const f = [...$("#drawer").querySelectorAll("button, input, select, textarea, [tabindex]:not([tabindex='-1'])")].filter((x) => !x.disabled && x.offsetParent !== null);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
    if (e.key === "Enter" && e.target.classList?.contains("hit")) e.target.dispatchEvent(new Event("focus"));
  });

  let resizeT = 0;
  window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (ui.view === "overview") drawChart(); }, 120); });

  /* =========================================================
     Boot
     ========================================================= */
  renderShell();
  const start = location.hash.slice(1);
  ui.view = VIEWS.includes(start) ? start : "overview";
  renderView();
})();
</script>
</body>
</html>
